    <script>
      (function () {
        function isExtensionError(msg, stack, filename) {
          var combined = String(msg || '') + ' ' + String(stack || '') + ' ' + String(filename || '');
          return (
            combined.indexOf('chrome-extension://') !== -1 ||
            combined.indexOf('moz-extension://') !== -1 ||
            combined.indexOf('MetaMask') !== -1
          );
        }
        window.addEventListener(
          'error',
          function (event) {
            var err = event.error;
            if (isExtensionError(event.message, err && err.stack, event.filename)) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event.reason;
            var msg = reason && (reason.message || String(reason));
            var stack = reason && reason.stack;
            if (isExtensionError(msg, stack, '')) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          },
          true
        );
      })();
    </script>
  </head>
